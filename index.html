<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, -apple-system, sans-serif; }

    body {
        background: linear-gradient(135deg, #eef2f7 0%, #dfe7f1 100%);
        min-height: 100vh;
        padding: 24px 16px;
        max-width: 960px;
        margin: 0 auto;
        color: #1f2937;
    }

    .folha {
        background: #ffffff;
        padding: 28px 26px 34px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(15, 23, 42, 0.04);
        border: 1px solid rgba(255,255,255,0.6);
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
        padding-bottom: 16px;
        border-bottom: 1px solid #e5e7eb;
        gap: 10px;
        flex-wrap: wrap;
    }
    .header-title {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .header-title .icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 700;
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }
    .header-title h1 {
        font-size: 17px;
        font-weight: 700;
        color: #111827;
        letter-spacing: -0.3px;
    }
    .header-title span {
        display: block;
        font-size: 12px;
        color: #6b7280;
        font-weight: 500;
    }

    /* ====== NAVEGAÇÃO DE MESES ====== */
    .mes-nav {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 4px;
        margin-bottom: 18px;
        justify-content: space-between;
        flex-wrap: wrap;
    }
    .mes-nav-center {
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .mes-btn {
        background: transparent;
        border: none;
        color: #1d4ed8;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        font-family: inherit;
    }
    .mes-btn:hover { background: #dbeafe; }
    .mes-btn:active { transform: scale(0.94); }

    .mes-atual {
        font-size: 15px;
        font-weight: 700;
        color: #111827;
        padding: 0 14px;
        min-width: 160px;
        text-align: center;
        letter-spacing: -0.2px;
        text-transform: capitalize;
    }

    .btn-hoje {
        background: #eff6ff;
        color: #1d4ed8;
        border: 1px solid #dbeafe;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.15s;
    }
    .btn-hoje:hover { background: #dbeafe; }

    .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn-action {
        padding: 9px 14px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: none;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.15s;
    }
    .btn-save {
        background: #16a34a;
        color: #fff;
        box-shadow: 0 1px 3px rgba(22, 163, 74, 0.3);
    }
    .btn-save:hover { background: #15803d; }
    .btn-print {
        background: #2563eb;
        color: #fff;
        box-shadow: 0 1px 3px rgba(37, 99, 235, 0.3);
    }
    .btn-print:hover { background: #1d4ed8; }
    .btn-action:active { transform: scale(0.97); }

    h2 {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #1e40af;
        margin: 26px 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    h2::before {
        content: '';
        width: 4px;
        height: 16px;
        background: linear-gradient(180deg, #3b82f6, #1d4ed8);
        border-radius: 2px;
    }

    .titulo-tabela {
        font-size: 18px;
        font-weight: 700;
        color: #111827;
        margin: 0 0 14px;
        text-align: left;
        letter-spacing: -0.4px;
        display: block;
    }

    /* ====== TABELA ====== */
    .tabela {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-bottom: 16px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        table-layout: fixed;
    }
    .tabela th {
        background: #f8fafc;
        color: #475569;
        font-weight: 600;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 11px 8px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
    }
    .tabela td {
        padding: 4px 8px;
        border-bottom: 1px solid #f1f5f9;
        text-align: left;
        font-size: 14px;
        background: #fff;
    }
    .tabela tbody tr:last-child td { border-bottom: none; }

    .tabela th:nth-child(1), .tabela td:nth-child(1) { width: 12%; }
    .tabela th:nth-child(2), .tabela td:nth-child(2) { width: 38%; }
    .tabela th:nth-child(3), .tabela td:nth-child(3) { width: 20%; padding-right: 14px; }
    .tabela th:nth-child(4), .tabela td:nth-child(4) { width: 20%; padding-left: 14px; }
    .tabela th:nth-child(5), .tabela td:nth-child(5) { width: 10%; }

    .tabela input, .tabela select {
        width: 100%;
        border: 1px solid transparent;
        background: transparent;
        padding: 8px 6px;
        font-size: 14px;
        color: #1f2937;
        border-radius: 6px;
        transition: all 0.15s;
        font-family: inherit;
        text-overflow: ellipsis;
    }
    .tabela input:focus, .tabela select:focus {
        outline: none;
        background: #fff;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }
    .tabela .val { font-weight: 600; }

    .botoes { margin: 10px 0 22px; display: flex; gap: 10px; flex-wrap: wrap; }
    button { font-family: inherit; cursor: pointer; border: none; transition: all 0.15s; }
    .add {
        background: #2563eb;
        color: white;
        padding: 10px 18px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
    }
    .add:hover { background: #1d4ed8; }

    .del {
        background: transparent;
        color: #94a3b8;
        padding: 6px 9px;
        font-size: 14px;
        border-radius: 6px;
    }
    .del:hover { background: #fee2e2; color: #dc2626; }

    .lista-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 14px;
        font-size: 14px;
        color: #374151;
        background: #fff;
        border-bottom: 1px solid #f1f5f9;
    }
    .lista-item:last-child { border-bottom: none; }
    #listaFixas, #listaVariaveis {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
    }
    #listaFixas:empty::after,
    #listaVariaveis:empty::after {
        content: 'Nenhum item cadastrado';
        display: block;
        padding: 14px;
        color: #9ca3af;
        font-size: 13px;
        font-style: italic;
        text-align: center;
        background: #f9fafb;
    }
    .lista-item span:last-child { font-weight: 600; color: #111827; }

    .lista-item input[type="text"] {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 8px 12px;
        text-align: right;
        width: 140px;
        font-size: 14px;
        font-weight: 600;
        color: #111827;
        background: #f8fafc;
        font-family: inherit;
    }
    .lista-item input[type="text"]:focus {
        outline: none;
        background: #fff;
        border-color: #3b82f6;
    }

    .linha-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
        margin-top: 8px;
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        color: #475569;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .linha-total span:last-child { font-size: 15px; font-weight: 700; }

    .linha-total.total-despesas {
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        color: #475569;
        font-size: 13px;
        margin-top: 14px;
    }
    .linha-total.total-despesas span:last-child { font-size: 15px; }

    .linha-total.final {
        background: linear-gradient(135deg, #1e40af, #1d4ed8);
        border: none;
        color: #ffffff;
        font-size: 13px;
        margin-top: 8px;
        padding: 16px 18px;
        border-radius: 10px;
        box-shadow: 0 6px 16px rgba(30, 64, 175, 0.22);
    }
    .linha-total.final span:last-child { font-size: 18px; font-weight: 800; }
    .linha-total.final .positivo { color: #86efac !important; }
    .linha-total.final .vermelho { color: #fca5a5 !important; }

    .vermelho { color: #dc2626 !important; }
    .positivo { color: #16a34a !important; }

    /* ====== RESPONSIVIDADE ====== */
    @media (max-width: 600px) {
        body { padding: 12px 8px; }
        .folha { padding: 20px 14px 24px; border-radius: 12px; }
        .tabela th, .tabela td { padding: 6px 4px; font-size: 11px; }
        .tabela input, .tabela select { font-size: 12px; padding: 6px 3px; }
        .lista-item { font-size: 13px; padding: 10px 12px; }
        .lista-item input[type="text"] { width: 110px; font-size: 13px; }

        .tabela th:nth-child(1), .tabela td:nth-child(1) { width: 13%; }
        .tabela th:nth-child(2), .tabela td:nth-child(2) { width: 40%; }
        .tabela th:nth-child(3), .tabela td:nth-child(3) { width: 20%; padding-right: 10px; }
        .tabela th:nth-child(4), .tabela td:nth-child(4) { width: 19%; padding-left: 10px; }
        .tabela th:nth-child(5), .tabela td:nth-child(5) { width: 8%; }

        .linha-total { font-size: 12px; padding: 12px 14px; }
        .linha-total span:last-child { font-size: 14px; }
        .linha-total.final { padding: 14px 16px; }
        .linha-total.final span:last-child { font-size: 16px; }

        .mes-atual { min-width: 130px; font-size: 14px; padding: 0 8px; }
        .header-actions { width: 100%; justify-content: flex-start; }
        .btn-action { flex: 1; justify-content: center; }
    }

    /* ====== ESTILO DE IMPRESSÃO ====== */
    @media print {
        @page { size: A4 portrait; margin: 12mm 10mm; }

        html, body {
            background: #fff !important;
            padding: 0 !important;
            margin: 0 !important;
            max-width: 100% !important;
            color: #000 !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .folha {
            box-shadow: none !important;
            border: none !important;
            padding: 0 !important;
            border-radius: 0 !important;
        }

        .mes-nav,
        .botoes,
        .btn-action,
        .del,
        .tabela th:last-child,
        .tabela td:last-child {
            display: none !important;
        }

        .header {
            border-bottom: 2px solid #1e40af !important;
            padding-bottom: 10px !important;
        }

        .tabela input,
        .tabela select,
        .lista-item input[type="text"] {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            padding: 4px 2px !important;
            color: #000 !important;
            font-weight: 600;
            -webkit-appearance: none;
            appearance: none;
        }

        .tabela { border: 1px solid #94a3b8 !important; }
        .tabela th {
            background: #e2e8f0 !important;
            color: #000 !important;
            border-bottom: 1px solid #94a3b8 !important;
        }
        .tabela td {
            background: #fff !important;
            border-bottom: 1px solid #cbd5e1 !important;
        }

        #listaFixas, #listaVariaveis { border: 1px solid #94a3b8 !important; }
        .lista-item { border-bottom: 1px solid #e2e8f0 !important; padding: 8px 12px !important; }

        .linha-total {
            background: #f1f5f9 !important;
            border: 1px solid #94a3b8 !important;
            color: #000 !important;
        }
        .linha-total.final {
            background: #dbeafe !important;
            border-color: #1e40af !important;
            color: #1e3a8a !important;
        }
        .linha-total.final .positivo { color: #15803d !important; }
        .linha-total.final .vermelho { color: #b91c1c !important; }

        .vermelho { color: #b91c1c !important; }
        .positivo { color: #15803d !important; }

        .tabela, .linha-total, #listaFixas, #listaVariaveis { page-break-inside: avoid; }
    }
</style>
</head>
<body>

<div class="folha">

    <div class="header">
        <div class="header-title">
            <div class="icon">$</div>
            <div>
                <h1>Controle Financeiro</h1>
                <span>Tabela sincronizada</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-action btn-save" onclick="salvarPDF()">💾 Salvar em PDF</button>
            <button class="btn-action btn-print" onclick="imprimirRelatorio()">🖨️ Imprimir</button>
        </div>
    </div>

    <!-- NAVEGAÇÃO DE MESES -->
    <div class="mes-nav">
        <div class="mes-nav-center">
            <button class="mes-btn" onclick="mudarMes(-1)" title="Mês anterior">‹</button>
            <div class="mes-atual" id="mesAtual">—</div>
            <button class="mes-btn" onclick="mudarMes(1)" title="Próximo mês">›</button>
        </div>
        <button class="btn-hoje" onclick="irParaHoje()">Mês Atual</button>
    </div>

    <h2 class="titulo-tabela">Gastos do Mês</h2>

    <table class="tabela" id="tabelaCorpo">
        <thead>
            <tr>
                <th>DIA</th>
                <th>ITEM</th>
                <th>CATEGORIA</th>
                <th>VALOR</th>
                <th style="text-align:center;">AÇÃO</th>
            </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
    </table>

    <div class="botoes">
        <button class="add" onclick="adicionarLinha()">+ Adicionar Item</button>
    </div>

    <h2>Receitas</h2>
    <div class="lista-item">
        <span>SALÁRIO:</span>
        <input type="text" id="salario" oninput="atualizarTudo()">
    </div>
    <div class="lista-item">
        <span>RENDA EXTRA:</span>
        <input type="text" id="rendaExtra" oninput="atualizarTudo()">
    </div>
    <div class="linha-total">
        <span>Total das Receitas =</span>
        <span id="totalReceitas" class="positivo">0,00</span>
    </div>

    <h2>Despesas Fixas</h2>
    <div id="listaFixas"></div>
    <div class="linha-total">
        <span>Total Despesas Fixas =</span>
        <span id="somaFixas" class="vermelho">0,00</span>
    </div>

    <h2>Despesas Variáveis</h2>
    <div id="listaVariaveis"></div>
    <div class="linha-total">
        <span>Total Despesas Variáveis =</span>
        <span id="somaVariaveis" class="vermelho">0,00</span>
    </div>

    <div class="linha-total total-despesas">
        <span>Total Despesas =</span>
        <span id="totalDespesas" class="vermelho">0,00</span>
    </div>

    <div class="linha-total final">
        <span>Saldo =</span>
        <span id="saldo" class="vermelho">0,00</span>
    </div>
</div>

<script>
    // ==================== ESTADO ====================
    const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                   'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    const hoje = new Date();
    let mesAtualIdx = hoje.getMonth();
    let anoAtual = hoje.getFullYear();

    // Chave do mês ex: "2026-9"
    function chaveMes(ano, mes) { return `${ano}-${mes}`; }

    // ==================== BANCO DE DADOS (localStorage) ====================
    const DB_KEY = 'controleFinanceiro_v1';

    function carregarDB() {
        try {
            const raw = localStorage.getItem(DB_KEY);
            return raw ? JSON.parse(raw) : {};
        } catch(e) { return {}; }
    }

    function salvarDB(db) {
        try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch(e) {}
    }

    let banco = carregarDB();

    // Estrutura de um mês:
    // { despesas: [{dia, nome, cat, val}], salario: "0,00", rendaExtra: "0,00" }

    function mesVazio() {
        return {
            despesas: [],
            salario: '0,00',
            rendaExtra: '0,00'
        };
    }

    function obterMes(ano, mes) {
        const k = chaveMes(ano, mes);
        if (!banco[k]) {
            banco[k] = mesVazio();
            salvarDB(banco);
        }
        return banco[k];
    }

    function gravarMes() {
        const m = obterMes(anoAtual, mesAtualIdx);
        // Salva os dados atuais da tela no banco
        m.salario = document.getElementById('salario').value;
        m.rendaExtra = document.getElementById('rendaExtra').value;
        m.despesas = [];

        document.querySelectorAll('#corpoTabela tr').forEach(tr => {
            m.despesas.push({
                dia: tr.querySelector('.dia').value,
                nome: tr.querySelector('.nome').value,
                cat: tr.querySelector('.cat').value,
                val: tr.querySelector('.val').value
            });
        });

        salvarDB(banco);
    }

    // ==================== RENDER ====================
    function dataDeHoje() {
        const d = String(hoje.getDate()).padStart(2, '0');
        const m = String(hoje.getMonth() + 1).padStart(2, '0');
        return `${d}/${m}`;
    }

    function linhaHTML(d) {
        return `
            <td><input class="dia" value="${d.dia || ''}"></td>
            <td><input class="nome" value="${(d.nome || '').replace(/"/g,'&quot;')}" oninput="atualizarTudo()"></td>
            <td>
                <select class="cat" onchange="atualizarTudo()">
                    <option value="fixa" ${d.cat === 'fixa' ? 'selected' : ''}>FIXA</option>
                    <option value="variavel" ${d.cat === 'variavel' ? 'selected' : ''}>VARIÁVEL</option>
                </select>
            </td>
            <td><input class="val" value="${d.val || ''}" oninput="atualizarTudo()"></td>
            <td style="text-align:center;"><button class="del" onclick="excluirLinha(this)">✕</button></td>
        `;
    }

    function renderizarMes() {
        const m = obterMes(anoAtual, mesAtualIdx);

        // Título
        document.getElementById('mesAtual').textContent = `${meses[mesAtualIdx]} ${anoAtual}`;

        // Receitas
        document.getElementById('salario').value = m.salario || '0,00';
        document.getElementById('rendaExtra').value = m.rendaExtra || '0,00';

        // Tabela
        const corpo = document.getElementById('corpoTabela');
        corpo.innerHTML = '';
        m.despesas.forEach(d => {
            const tr = document.createElement('tr');
            tr.innerHTML = linhaHTML(d);
            corpo.appendChild(tr);
        });

        atualizarTudo();
    }

    // ==================== NAVEGAÇÃO ====================
    function mudarMes(delta) {
        gravarMes(); // Salva o mês atual antes de sair
        mesAtualIdx += delta;
        if (mesAtualIdx > 11) { mesAtualIdx = 0; anoAtual++; }
        if (mesAtualIdx < 0) { mesAtualIdx = 11; anoAtual--; }
        renderizarMes();
    }

    function irParaHoje() {
        gravarMes();
        mesAtualIdx = hoje.getMonth();
        anoAtual = hoje.getFullYear();
        renderizarMes();
    }

    // ==================== FUNÇÕES ====================
    function num(texto) {
        if (typeof texto === 'number') return texto;
        return parseFloat(String(texto).replace(/\./g, '').replace(',', '.')) || 0;
    }
    function fmt(n) {
        return n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function atualizarTudo() {
        const salario = num(document.getElementById('salario').value);
        const rendaExtra = num(document.getElementById('rendaExtra').value);
        const totalReceitas = salario + rendaExtra;
        document.getElementById('totalReceitas').textContent = fmt(totalReceitas);

        const listaFixas = document.getElementById('listaFixas');
        const listaVariaveis = document.getElementById('listaVariaveis');
        listaFixas.innerHTML = '';
        listaVariaveis.innerHTML = '';
        let somaFixas = 0, somaVariaveis = 0;

        document.querySelectorAll('#corpoTabela tr').forEach(linha => {
            const nome = linha.querySelector('.nome').value || '(sem nome)';
            const valor = num(linha.querySelector('.val').value);
            const cat = linha.querySelector('.cat').value;

            const item = document.createElement('div');
            item.className = 'lista-item';
            item.innerHTML = `<span>${nome}</span><span>${fmt(valor)}</span>`;

            if (cat === 'fixa') {
                listaFixas.appendChild(item);
                somaFixas += valor;
            } else {
                listaVariaveis.appendChild(item);
                somaVariaveis += valor;
            }
        });

        document.getElementById('somaFixas').textContent = fmt(somaFixas);
        document.getElementById('somaVariaveis').textContent = fmt(somaVariaveis);
        const totalDespesas = somaFixas + somaVariaveis;
        document.getElementById('totalDespesas').textContent = fmt(totalDespesas);

        const saldo = totalReceitas - totalDespesas;
        const elSaldo = document.getElementById('saldo');
        elSaldo.textContent = (saldo < 0 ? '- ' : '') + fmt(Math.abs(saldo));
        elSaldo.className = saldo < 0 ? 'vermelho' : 'positivo';

        // Auto-salva no banco a cada alteração
        gravarMes();
    }

    function adicionarLinha() {
        const corpo = document.getElementById('corpoTabela');
        const nova = document.createElement('tr');
        nova.innerHTML = linhaHTML({ dia: dataDeHoje(), nome: '', cat: 'fixa', val: '' });
        corpo.appendChild(nova);
        atualizarTudo();
    }

    function excluirLinha(botao) {
        botao.closest('tr').remove();
        atualizarTudo();
    }

    // ==================== IMPRESSÃO ====================
    // Monta um HTML limpo para impressão (sem botões, sem inputs editáveis)
    function montarRelatorioHTML() {
        const mesNome = `${meses[mesAtualIdx]} ${anoAtual}`;

        // Tabela de despesas (sem coluna AÇÃO)
        let linhas = '';
        document.querySelectorAll('#corpoTabela tr').forEach(tr => {
            const dia = tr.querySelector('.dia').value;
            const nome = tr.querySelector('.nome').value;
            const cat = tr.querySelector('.cat').value === 'fixa' ? 'FIXA' : 'VARIÁVEL';
            const val = tr.querySelector('.val').value;
            linhas += `<tr><td>${dia}</td><td>${nome}</td><td>${cat}</td><td style="text-align:right;">${val}</td></tr>`;
        });

        // Listas de fixas e variáveis
        let fixasHTML = '', variaveisHTML = '';
        document.querySelectorAll('#listaFixas .lista-item').forEach(el => {
            fixasHTML += `<div class="li"><span>${el.children[0].textContent}</span><span>${el.children[1].textContent}</span></div>`;
        });
        document.querySelectorAll('#listaVariaveis .lista-item').forEach(el => {
            variaveisHTML += `<div class="li"><span>${el.children[0].textContent}</span><span>${el.children[1].textContent}</span></div>`;
        });

        const salario = document.getElementById('salario').value;
        const rendaExtra = document.getElementById('rendaExtra').value;
        const tRec = document.getElementById('totalReceitas').textContent;
        const tFix = document.getElementById('somaFixas').textContent;
        const tVar = document.getElementById('somaVariaveis').textContent;
        const tDes = document.getElementById('totalDespesas').textContent;
        const saldo = document.getElementById('saldo').textContent;

        return `
            <div class="relatorio">
                <div class="rel-header">
                    <h1>Controle Financeiro</h1>
                    <div class="rel-mes">${mesNome}</div>
                </div>

                <h2>Gastos do Mês</h2>
                <table class="rel-tabela">
                    <thead>
                        <tr><th>DIA</th><th>ITEM</th><th>CATEGORIA</th><th style="text-align:right;">VALOR</th></tr>
                    </thead>
                    <tbody>${linhas || '<tr><td colspan="4" style="text-align:center;color:#888;">Nenhum item</td></tr>'}</tbody>
                </table>

                <h2>Receitas</h2>
                <div class="li"><span>SALÁRIO</span><span>${salario}</span></div>
                <div class="li"><span>RENDA EXTRA</span><span>${rendaExtra}</span></div>
                <div class="li total"><span>Total das Receitas</span><span>${tRec}</span></div>

                <h2>Despesas Fixas</h2>
                ${fixasHTML || '<div class="li vazio">Nenhum item</div>'}
                <div class="li total"><span>Total Despesas Fixas</span><span>${tFix}</span></div>

                <h2>Despesas Variáveis</h2>
                ${variaveisHTML || '<div class="li vazio">Nenhum item</div>'}
                <div class="li total"><span>Total Despesas Variáveis</span><span>${tVar}</span></div>

                <div class="li total desp"><span>Total Despesas</span><span>${tDes}</span></div>
                <div class="li total saldo"><span>Saldo</span><span>${saldo}</span></div>
            </div>
        `;
    }

    function imprimirRelatorio() {
        // Envia comando para o Kodular imprimir (abre serviço de impressão do Android)
        if (window.Kodular && window.Kodular.setWebViewString) {
            window.Kodular.setWebViewString("IMPRIMIR");
        } else if (window.AppInventor && window.AppInventor.setWebViewString) {
            window.AppInventor.setWebViewString("IMPRIMIR");
        } else {
            // Fallback navegador: abre janela com o relatório e chama print
            const html = montarRelatorioHTML();
            const win = window.open('', '_blank');
            win.document.write(`
                <html><head><title>Relatório - ${meses[mesAtualIdx]} ${anoAtual}</title>
                <style>
                    body { font-family: 'Segoe UI', Roboto, sans-serif; padding: 30px; color: #111827; max-width: 800px; margin: 0 auto; }
                    .rel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e40af; padding-bottom: 10px; margin-bottom: 20px; }
                    .rel-header h1 { color: #1e40af; font-size: 22px; }
                    .rel-mes { font-size: 16px; font-weight: 700; color: #1d4ed8; background: #eff6ff; padding: 6px 14px; border-radius: 20px; }
                    h2 { font-size: 13px; color: #1e40af; text-transform: uppercase; margin: 20px 0 8px; letter-spacing: 0.5px; }
                    .rel-tabela { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
                    .rel-tabela th { background: #e2e8f0; padding: 8px; text-align: left; font-size: 12px; border: 1px solid #94a3b8; }
                    .rel-tabela td { padding: 8px; font-size: 13px; border: 1px solid #cbd5e1; }
                    .li { display: flex; justify-content: space-between; padding: 9px 12px; border-bottom: 1px solid #e2e8f0; font-size: 13px; background: #fff; }
                    .li.total { background: #f1f5f9; font-weight: 700; border: 1px solid #94a3b8; border-radius: 6px; margin-top: 6px; }
                    .li.desp { margin-top: 14px; }
                    .li.saldo { background: #dbeafe; border-color: #1e40af; color: #1e3a8a; font-weight: 800; font-size: 15px; }
                    .li.vazio { color: #888; font-style: italic; text-align: center; }
                </style></head><body>${html}</body></html>
            `);
            win.document.close();
            setTimeout(() => { win.focus(); win.print(); }, 300);
        }
    }

    function salvarPDF() {
        // Envia comando para o Kodular gerar PDF
        if (window.Kodular && window.Kodular.setWebViewString) {
            window.Kodular.setWebViewString("SALVAR_PDF");
        } else if (window.AppInventor && window.AppInventor.setWebViewString) {
            window.AppInventor.setWebViewString("SALVAR_PDF");
        } else {
            // Fallback navegador: abre janela e chama print (usuário salva como PDF)
            imprimirRelatorio();
        }
    }

    // ==================== INICIALIZAÇÃO ====================
    renderizarMes();

    // Garante que ao fechar o app o mês atual seja salvo
    window.addEventListener('beforeunload', gravarMes);
</script>

</body>
</html>
